name: Publish tested installer pairing preview
on:
  push:
    branches: [publish/installer-pairing-preview-1]
    paths: ['.github/workflows/publish-installer-pairing-preview.yml']
permissions:
  actions: read
  contents: write
jobs:
  publish:
    if: github.repository == 'AdriFOG/Bloombox-iOS'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: '45778955178'
      ARTIFACT_ID: '15097364977'
      TESTED_HEAD: '260d15d83a20dd0d51605231dd4a21fc3bc8592b'
      TESTED_MERGE: '50b2ab047017b5c0cd3a2fff49814c7c06eb7514'
      TAG: 'v3.4.0-installer-pairing.1'
    steps:
      - name: Verify exact successful build and artifact
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID" | jq -e --arg sha "$TESTED_HEAD" '.conclusion == "success" and .head_sha == $sha and .head_branch == "fix/installer-pairing-import"'
          gh api "repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID" | jq -e --argjson run "$RUN_ID" '.name == "BloomBox-SideStore-unsigned.ipa" and .expired == false and .workflow_run.id == $run and .digest == "sha256:5b313cf557e4cc241d4761ebcc0566a183633fea6b1cb741826ccfea3d809bf4"'
          gh api "repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID/zip" > artifact.zip
          echo "5b313cf557e4cc241d4761ebcc0566a183633fea6b1cb741826ccfea3d809bf4  artifact.zip" | sha256sum -c -
          mkdir release
          unzip -j artifact.zip BloomBox-SideStore-unsigned.ipa -d release
          unzip -tq release/BloomBox-SideStore-unsigned.ipa
          (cd release && sha256sum BloomBox-SideStore-unsigned.ipa > SHA256SUMS.txt)
      - name: Publish existing IPA without rebuilding
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Prerelease already exists; refusing overwrite."
            exit 1
          fi
          gh release create "$TAG" release/BloomBox-SideStore-unsigned.ipa release/SHA256SUMS.txt --target "$TESTED_HEAD" --prerelease --latest=false --title "BloomBox 3.4.0 — Installer Pairing Preview 1" --notes "Experimental no-PC pairing import. Exact IPA from successful Actions run 45778955178, artifact 15097364977. PR #32; tested head $TESTED_HEAD, PR merge $TESTED_MERGE. No rebuild. JIT and RAM+ behavior unchanged; integrated SideStore pairing handoff not yet validated. Not a stable release. / Importación experimental de pairing sin PC; conserva la versión estable y requiere pruebas en el iPhone."

name: BloomBox nested launch probe
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/nested-bloombox-probe.yml
      - LiveContainer/LCBootstrap.m
      - LiveContainerSwiftUI/App/LiveContainerSwiftUIApp.swift
      - Scripts/package-nested-bloombox-probe.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    if: github.head_ref == 'experimental/nested-bloombox-probe' || github.ref == 'refs/heads/experimental/nested-bloombox-probe'
    runs-on: macos-latest
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Restore pinned dependencies
        run: python3 Scripts/fetch-bundled-dependencies.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Build pairing library
        run: bash Scripts/build-ondevice-pairing.sh
      - name: Render application icon
        run: swift Scripts/generate-bloombox-icon.swift
      - name: Compile fresh BloomBox archive
        run: |
          set -euo pipefail
          if ls -d *.xcworkspace >/dev/null 2>&1; then
            project_args=(-workspace "$(ls -d *.xcworkspace | head -n 1)")
          else
            project_args=(-project LiveContainer.xcodeproj)
          fi
          xcodebuild archive -archivePath "$PWD/probe.xcarchive" -scheme LiveContainer "${project_args[@]}" -sdk iphoneos -arch arm64 -configuration Release > "$RUNNER_TEMP/probe-archive.log" 2>&1 || {
            grep -nE 'error:|fatal error|Undefined symbols' "$RUNNER_TEMP/probe-archive.log" | tail -n 60 || true
            tail -n 100 "$RUNNER_TEMP/probe-archive.log"
            exit 1
          }
      - name: Package and validate isolated guest
        run: |
          set -euo pipefail
          mkdir Payload
          ditto probe.xcarchive/Products/Applications/LiveContainer.app Payload/LiveContainer.app
          zip -q -r source.ipa Payload
          python3 Scripts/package-nested-bloombox-probe.py source.ipa
          shasum -a 256 BloomBox-Dev-Nested-Probe-v2.ipa > BloomBox-Dev-Nested-Probe-v2.sha256
      - name: Upload probe IPA
        uses: actions/upload-artifact@v4
        with:
          name: BloomBox-Dev-Nested-Probe-v2
          path: |
            BloomBox-Dev-Nested-Probe-v2.ipa
            BloomBox-Dev-Nested-Probe-v2.sha256
          if-no-files-found: error
      - name: Upload archive diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: probe-archive-log
          path: ${{ runner.temp }}/probe-archive.log
          if-no-files-found: ignore

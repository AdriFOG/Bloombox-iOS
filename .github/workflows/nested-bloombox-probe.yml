name: BloomBox nested launch probe
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/nested-bloombox-probe.yml
      - Experiments/NestedProbeV3/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    if: github.head_ref == 'experimental/nested-bloombox-probe' || github.ref == 'refs/heads/experimental/nested-bloombox-probe'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile minimal UIKit guest
        run: |
          set -euo pipefail
          app="Payload/BloomBoxDevProbeV3.app"
          mkdir -p "$app"
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 -fobjc-arc -O2 -Wall -Wextra -Wno-unused-parameter -framework UIKit -framework Foundation Experiments/NestedProbeV3/main.m -o "$app/BloomBoxDevProbeV3"
          cp Experiments/NestedProbeV3/Info.plist "$app/Info.plist"
          plutil -lint "$app/Info.plist"
          codesign --force --sign - --timestamp=none "$app"
          xcrun otool -L "$app/BloomBoxDevProbeV3"
          xcrun vtool -show-build "$app/BloomBoxDevProbeV3"
          zip -q -r BloomBox-Dev-Nested-Probe-v3.ipa Payload
          python3 - <<'PY'
          import plistlib
          from zipfile import ZipFile
          root = "Payload/BloomBoxDevProbeV3.app/"
          with ZipFile("BloomBox-Dev-Nested-Probe-v3.ipa") as z:
              assert z.testzip() is None
              assert not any("/Frameworks/" in n or "/PlugIns/" in n for n in z.namelist())
              info = plistlib.loads(z.read(root + "Info.plist"))
              assert info["CFBundleIdentifier"] == "com.bloombox.dev.nestedprobe.v3"
              assert info["CFBundleExecutable"] == "BloomBoxDevProbeV3"
              assert b"BloomBoxDevProbeV3.log" in z.read(root + info["CFBundleExecutable"])
          PY
          shasum -a 256 BloomBox-Dev-Nested-Probe-v3.ipa > BloomBox-Dev-Nested-Probe-v3.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: BloomBox-Dev-Nested-Probe-v3
          path: |
            BloomBox-Dev-Nested-Probe-v3.ipa
            BloomBox-Dev-Nested-Probe-v3.sha256
          if-no-files-found: error

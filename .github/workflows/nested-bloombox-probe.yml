name: BloomBox nested launch probe
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/nested-bloombox-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    if: github.head_ref == 'experimental/nested-bloombox-probe' || github.ref == 'refs/heads/experimental/nested-bloombox-probe'
    runs-on: ubuntu-latest
    steps:
      - name: Download pinned official unsigned BloomBox 3.6.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v3.6.0 --repo AdriFOG/Bloombox-iOS --pattern BloomBox-SideStore-unsigned.ipa --pattern SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Prepare separate unsigned guest identity
        run: |
          python3 - <<'PY'
          import copy, plistlib
          from zipfile import ZipFile
          source = "BloomBox-SideStore-unsigned.ipa"
          target = "BloomBox-Dev-Nested-Probe.ipa"
          root = "Payload/LiveContainer.app/"
          new_root = "Payload/BloomBoxDev.app/"
          with ZipFile(source) as src:
              assert src.testzip() is None
              info = plistlib.loads(src.read(root + "Info.plist"))
              assert info["CFBundleShortVersionString"] == "3.6.0"
              assert info["CFBundleExecutable"] == "LiveContainer"
              assert root + "LiveContainer" in src.namelist()
              info.update(CFBundleExecutable="BloomBoxDev", CFBundleIdentifier="com.bloombox.dev.nestedprobe", CFBundleDisplayName="BloomBox Dev Probe", CFBundleName="BloomBox Dev Probe")
              info["CFBundleURLTypes"] = [{"CFBundleURLName": "com.bloombox.dev.nestedprobe", "CFBundleURLSchemes": ["bloomboxdevprobe"]}]
              with ZipFile(target, "w") as dst:
                  for entry in src.infolist():
                      name = entry.filename
                      if not name.startswith(root):
                          continue
                      rel = name[len(root):]
                      # Extensions cannot be registered from a guest IPA; do not ship them in the launch-only probe.
                      if rel.startswith(("PlugIns/", "_CodeSignature/")) or rel == "embedded.mobileprovision":
                          continue
                      if rel.endswith("/InfoPlist.strings") and rel.count("/") == 1:
                          continue
                      renamed = "BloomBoxDev" if rel == "LiveContainer" else rel
                      out = copy.copy(entry)
                      out.filename = new_root + renamed
                      out.orig_filename = out.filename
                      if rel == "Info.plist":
                          dst.writestr(out, plistlib.dumps(info))
                      else:
                          with src.open(entry) as i, dst.open(out, "w") as o:
                              import shutil
                              shutil.copyfileobj(i, o, 1024 * 1024)
          with ZipFile(target) as dst:
              assert dst.testzip() is None
              assert len(dst.namelist()) == len(set(dst.namelist()))
              assert new_root + "BloomBoxDev" in dst.namelist()
              assert new_root + "LiveContainer" not in dst.namelist()
              assert new_root + "Frameworks/LiveContainerShared.framework/LiveContainerShared" in dst.namelist()
              assert new_root + "Frameworks/LiveContainerSwiftUI.framework/LiveContainerSwiftUI" in dst.namelist()
              result = plistlib.loads(dst.read(new_root + "Info.plist"))
              assert result["CFBundleIdentifier"] == "com.bloombox.dev.nestedprobe"
              assert result["CFBundleExecutable"] == "BloomBoxDev"
              print("PASS: unique guest identity and executable; launch-only unsigned probe")
          PY
          sha256sum BloomBox-Dev-Nested-Probe.ipa > BloomBox-Dev-Nested-Probe.sha256
      - name: Upload probe IPA
        uses: actions/upload-artifact@v4
        with:
          name: BloomBox-Dev-Nested-Probe
          path: |
            BloomBox-Dev-Nested-Probe.ipa
            BloomBox-Dev-Nested-Probe.sha256
          if-no-files-found: error

name: Publish tested installer pairing preview
on:
  push:
    branches: [publish/installer-pairing-preview-1]
    paths: ['.github/workflows/publish-installer-pairing-preview-2.yml']
permissions:
  actions: read
  contents: write
jobs:
  publish:
    if: github.repository == 'AdriFOG/Bloombox-iOS'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: '45787506851'
      ARTIFACT_ID: '15102132138'
      TESTED_HEAD: 'd9f2dfd3f4c0ac61b3db38735f60223d32190700'
      TAG: 'v3.4.0-installer-pairing.2'
    steps:
      - name: Verify exact successful build and artifact
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID" | jq -e --arg sha "$TESTED_HEAD" '.conclusion == "success" and .head_sha == $sha and .head_branch == "fix/installer-pairing-import"'
          gh api "repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID" | jq -e --argjson run "$RUN_ID" '.name == "BloomBox-SideStore-unsigned.ipa" and .expired == false and .workflow_run.id == $run and .digest == "sha256:bf321749c97b8162482e63faaa362ba467196ee996232fca2bf7d5be6f5ecb8c"'
          gh api "repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID/zip" > artifact.zip
          echo "bf321749c97b8162482e63faaa362ba467196ee996232fca2bf7d5be6f5ecb8c  artifact.zip" | sha256sum -c -
          mkdir release
          unzip -j artifact.zip BloomBox-SideStore-unsigned.ipa -d release
          unzip -tq release/BloomBox-SideStore-unsigned.ipa
          (cd release && sha256sum BloomBox-SideStore-unsigned.ipa > SHA256SUMS.txt)
      - name: Publish existing IPA without rebuilding
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Prerelease already exists; refusing overwrite."
            exit 1
          fi
          gh release create "$TAG" release/BloomBox-SideStore-unsigned.ipa release/SHA256SUMS.txt --target "$TESTED_HEAD" --prerelease --latest=false --title "BloomBox 3.4.0 — Installer Pairing Preview 2" --notes "Experimental no-PC pairing import. Exact IPA from successful Actions run 45787506851, artifact 15102132138. PR #32; tested push commit $TESTED_HEAD. Adds automatic SideStore handoff, local export and pairing diagnostics. No rebuild. JIT and RAM+ behavior unchanged; integrated SideStore pairing handoff passed synthetic tests but still needs on-device validation. Not a stable release. / Importación experimental de pairing sin PC; conserva la versión estable y requiere pruebas en el iPhone."

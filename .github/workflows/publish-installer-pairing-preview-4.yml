name: Publish tested installer pairing preview
on:
  push:
    branches: [publish/installer-pairing-preview-1]
    paths: ['.github/workflows/publish-installer-pairing-preview-4.yml']
permissions:
  actions: read
  contents: write
jobs:
  publish:
    if: github.repository == 'AdriFOG/Bloombox-iOS'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: '45881492233'
      ARTIFACT_ID: '15147797835'
      TESTED_HEAD: '2e9941adba2b54ceffb562a76a0e74353862bbed'
      TAG: 'v3.4.0-installer-pairing.4'
    steps:
      - name: Verify exact successful build and artifact
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID" | jq -e --arg sha "$TESTED_HEAD" '.conclusion == "success" and .head_sha == $sha and .head_branch == "fix/installer-pairing-import"'
          gh api "repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID" | jq -e --argjson run "$RUN_ID" '.name == "BloomBox-SideStore-unsigned.ipa" and .expired == false and .workflow_run.id == $run and .digest == "sha256:fb3892ccc2c3691762fad0c2ea27087c186b962feea15c12ec5fdf6c69b66a1a"'
          gh api "repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID/zip" > artifact.zip
          echo "fb3892ccc2c3691762fad0c2ea27087c186b962feea15c12ec5fdf6c69b66a1a  artifact.zip" | sha256sum -c -
          mkdir release
          unzip -j artifact.zip BloomBox-SideStore-unsigned.ipa -d release
          unzip -tq release/BloomBox-SideStore-unsigned.ipa
          (cd release && sha256sum BloomBox-SideStore-unsigned.ipa > SHA256SUMS.txt)
      - name: Publish existing IPA without rebuilding
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Prerelease already exists; refusing overwrite."
            exit 1
          fi
          gh release create "$TAG" release/BloomBox-SideStore-unsigned.ipa release/SHA256SUMS.txt --target "$TESTED_HEAD" --prerelease --latest=false --title "BloomBox 3.4.0 — Installer Pairing Preview 4" --notes "Experimental no-PC pairing import. Exact IPA from successful Actions run 45881492233, artifact 15147797835. PR #32; tested push commit $TESTED_HEAD. Adds login-screen Anisette repair and one-time public metadata synchronization for installer defaults. ADI reset remains manual. No certificate, password, token or pairing changes. Login UI and RAM+ require on-device validation. No rebuild. Not a stable release. / Reparación de Anisette en el login; conserva firma, pairing y JIT. Reinicio de ADI manual. Pendiente de prueba en iPhone."
